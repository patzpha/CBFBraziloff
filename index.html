<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayStation 5</title>
  <script src="https://kit.fontawesome.com/0c87a70838.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #000; min-height: 100vh; color: #fff; overflow: hidden; }

    /* BACKGROUND */
    .bg-layer {
      position: fixed; inset: 0;
      background: url('assets/gifs/gif-fundo-ps5.gif') no-repeat center center fixed;
      background-size: cover; z-index: 1; transition: opacity 0.8s ease;
    }
    .bg-layer.fade-out { opacity: 0; }

    /* SELECTION SCREEN */
    .select-screen {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      transition: opacity 0.6s ease;
    }
    .select-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .select-title { font-size: 22px; color: #ddd; margin-bottom: 60px; }
    .accounts-row { display: flex; align-items: center; gap: 50px; }

    /* PROFILE CIRCLE */
    .user-account {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      cursor: pointer; transition: transform 0.3s ease;
    }
    .user-account:hover { transform: scale(1.08); }
    .avatar-ring {
      width: 140px; height: 140px; border-radius: 50%;
      background: linear-gradient(135deg, #6a48ff, #00d4ff); padding: 3px;
      display: flex; justify-content: center; align-items: center;
    }
    .avatar-img {
      width: 134px; height: 134px; border-radius: 50%;
      object-fit: cover; background: #1a1a1a;
    }
    .user-name { font-size: 18px; color: #fff; }

    /* NEW USER BUTTON */
    .new-user-btn {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      cursor: pointer; transition: transform 0.3s ease;
    }
    .new-user-btn:hover { transform: scale(1.08); }
    .plus-circle {
      width: 140px; height: 140px; border-radius: 50%;
      background: rgba(255,255,255,0.1); display: flex;
      justify-content: center; align-items: center;
      font-size: 48px; color: #aaa; transition: all 0.3s ease;
    }
    .new-user-btn:hover .plus-circle { background: rgba(255,255,255,0.2); color: #fff; }
    .new-user-text { font-size: 18px; color: #aaa; }

    /* CREATE SCREEN */
    .create-screen {
      position: fixed; inset: 0; z-index: 20;
      display: none; justify-content: center; align-items: center;
      background: rgba(0,0,0,0.7); opacity: 0; transition: opacity 0.5s ease;
    }
    .create-screen.active { display: flex; opacity: 1; }
    .create-box {
      display: flex; flex-direction: column; align-items: center; gap: 25px;
      padding: 40px 50px; background: rgba(20,20,25,0.95);
      border-radius: 16px; border: 1px solid #333;
    }
    .back-link { align-self: flex-start; color: #00a8ff; cursor: pointer; text-decoration: none; }
    .photo-picker { cursor: pointer; }
    .photo-ring {
      width: 130px; height: 130px; border-radius: 50%; border: 3px solid #444;
      display: flex; justify-content: center; align-items: center;
      background: #222; overflow: hidden; transition: border-color 0.3s ease;
    }
    .photo-picker:hover .photo-ring { border-color: #00d06c; }
    .photo-inner {
      width: 120px; height: 120px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden;
    }
    .photo-inner img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .photo-inner.has-img .ph-icon { display: none; }
    .photo-inner.has-img img { display: block; }
    .ph-icon { font-size: 40px; color: #777; }
    #file-input, #change-photo-input { display: none; }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 14px; color: #aaa; }
    .field-input {
      width: 280px; padding: 12px 15px; font-size: 16px;
      border: 2px solid #333; border-radius: 8px;
      background: #1a1a1a; color: #fff; outline: none;
    }
    .save-btn {
      width: 280px; padding: 13px; font-size: 18px; font-weight: 600;
      border: none; border-radius: 8px; background: #00a84f;
      color: #fff; cursor: pointer; transition: all 0.3s ease;
    }
    .save-btn:hover { background: #00c05c; transform: scale(1.03); }

    /* PS5 INTERFACE */
    .ps5-main {
      position: fixed; inset: 0; z-index: 5;
      opacity: 0; pointer-events: none; transition: opacity 0.8s ease;
    }
    .ps5-main.visible { opacity: 1; pointer-events: auto; }
    .game-bg {
      position: absolute; inset: 0;
      background: url('assets/images/fundo-fnaf.jpg') no-repeat center center;
      background-size: cover;
    }
    .bg-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to right, rgba(0,0,0,.75) 0%, rgba(0,0,0,.25) 35%, rgba(0,0,0,.1) 100%);
    }
    header {
      position: relative; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: 25px 50px;
    }
    .menu-left { display: flex; gap: 50px; }
    .menu-left a {
      color: #aaa; text-decoration: none; font-size: 18px;
    }
    .menu-left a:first-child { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 6px; }
    .menu-right { display: flex; gap: 25px; align-items: center; }
    .menu-right a { color: #aaa; font-size: 20px; text-decoration: none; }
    
    /* ✅ FOTO DO CANTO — SEM perfil.jpg! */
    .mini-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      object-fit: cover; border: 2px solid transparent;
      cursor: pointer; transition: all 0.3s ease;
      
      /* Foto padrão — sem arquivo! */
      background: #2a2a2a;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #888;
    }
    /* Quando tem foto escolhida — mostra a sua */
    .mini-avatar.has-photo {
      background: none;
      border-color: rgba(255,255,255,0.3);
    }
    .mini-avatar:hover { box-shadow: 0 0 10px rgba(255,255,255,0.4); }
    
    .time-text { font-size: 18px; color: #fff; }

    .carousel-wrap { position: absolute; top: 120px; left: 0; width: 100%; overflow: hidden; }
    .games-track { display: flex; gap: 20px; padding-left: 50px; transition: transform 0.5s ease; }
    .game-card {
      flex-shrink: 0; width: 100px; height: 130px; border-radius: 8px;
      overflow: hidden; border: 2px solid transparent;
      opacity: 0.5; transform: scale(0.85); cursor: pointer; transition: all 0.3s ease;
    }
    .game-card.active { width: 130px; height: 170px; border-color: #fff; opacity: 1; transform: scale(1); }
    .game-card img { width: 100%; height: 100%; object-fit: cover; }
    .game-title { position: absolute; top: 310px; left: 50px; font-size: 22px; font-weight: 600; }
    .play-area { position: absolute; bottom: 130px; left: 50px; display: flex; gap: 15px; }
    .play-btn {
      width: 200px; height: 50px; border-radius: 25px;
      background: #00439c; border: none; color: #fff;
      font-size: 20px; font-weight: bold; cursor: pointer;
    }
    .more-btn {
      width: 50px; height: 50px; border-radius: 50%;
      background: #00439c; border: none; color: #fff;
      font-size: 24px; cursor: pointer;
    }
    .side-panel {
      position: absolute; right: 50px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 15px;
    }
    .side-game-card {
      width: 200px; border-radius: 8px; overflow: hidden;
      background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
    }
    .side-game-card img { width: 100%; height: 120px; object-fit: cover; }
    .side-info { padding: 10px; }
    .tag {
      display: inline-block; background: #fff; color: #000;
      font-size: 11px; font-weight: 600; padding: 2px 6px;
      border-radius: 2px; margin-bottom: 5px;
    }
    .tag-blue { background: #0066cc; color: #fff; margin-left: 4px; }
    .progress-box {
      display: flex; justify-content: space-between; width: 200px;
      background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 12px;
    }
    .progress-col { text-align: center; }
    .progress-label { font-size: 12px; color: #999; margin-bottom: 4px; }
    .progress-val { font-size: 18px; font-weight: 600; }
    .logout-tip {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      font-size: 13px; color: #666;
    }
    .logout-tip span { color: #00a8ff; cursor: pointer; }
  </style>
</head>
<body>

  <!-- BACKGROUND -->
  <div class="bg-layer" id="bg-layer"></div>

  <!-- SELECTION SCREEN -->
  <div class="select-screen" id="select-screen">
    <h1 class="select-title">Who's using the controller?</h1>
    <div class="accounts-row" id="accounts-row"></div>
  </div>

  <!-- CREATE SCREEN -->
  <div class="create-screen" id="create-screen">
    <div class="create-box">
      <span class="back-link" id="back-to-select">← Back</span>
      <label class="photo-picker" for="file-input">
        <div class="photo-ring">
          <div class="photo-inner" id="preview-holder">
            <span class="ph-icon">+</span>
            <img id="preview-img" alt="Profile photo">
          </div>
        </div>
      </label>
      <input type="file" id="file-input" accept="image/*">
      <div class="field-group">
        <label class="field-label">Your name</label>
        <input type="text" class="field-input" id="name-field" placeholder="Enter your name...">
      </div>
      <button class="save-btn" id="create-account-btn">OK</button>
    </div>
  </div>

  <!-- PS5 INTERFACE -->
  <div class="ps5-main" id="ps5-interface">
    <div class="game-bg" id="game-bg"></div>
    <div class="bg-overlay"></div>
    <header>
      <div class="menu-left">
        <a href="#">Games</a>
        <a href="#">Media</a>
      </div>
      <div class="menu-right">
        <a href="#"><i class="fas fa-search"></i></a>
        <a href="#"><i class="fas fa-cog"></i></a>
        <!-- ✅ FOTO NO CANTO — CLICA PRA TROCAR! -->
        <label for="change-photo-input" style="cursor:pointer; margin:0; padding:0;">
          <div class="mini-avatar" id="current-avatar">
            <i class="fas fa-user"></i>
          </div>
        </label>
        <input type="file" id="change-photo-input" accept="image/*">
        <span class="time-text" id="clock">--:--</span>
      </div>
    </header>

    <div class="carousel-wrap">
      <div class="games-track" id="games-track">
        <div class="game-card" data-index="0"><img src="assets/images/capa-gta.jpg" alt=""></div>
        <div class="game-card" data-index="1"><img src="assets/images/capa-fnaf.jpg" alt=""></div>
        <div class="game-card active" data-index="2"><img src="assets/images/capa-minecraft.jpg" alt=""></div>
        <div class="game-card" data-index="3"><img src="assets/images/capa-dirt5.jpg" alt=""></div>
        <div class="game-card" data-index="4"><img src="assets/images/capa-spiderman.jpg" alt=""></div>
      </div>
    </div>

    <h2 class="game-title" id="game-title">Five Nights At Freddy's™</h2>

    <div class="play-area">
      <button class="play-btn" id="play-btn">Play</button>
      <button class="more-btn">⋯</button>
    </div>

    <div class="side-panel">
      <div class="side-game-card">
        <img id="side-cover" src="assets/images/capa-fnaf.jpg" alt="">
        <div class="side-info">
          <span class="tag">Full Game</span>
          <span class="tag tag-blue">Free PS5 Upgrade</span>
        </div>
      </div>
      <div class="progress-box">
        <div class="progress-col">
          <div class="progress-label">Progress</div>
          <div class="progress-val">—</div>
        </div>
        <div class="progress-col">
          <div class="progress-label">Trophies</div>
          <div class="progress-val">—</div>
        </div>
      </div>
    </div>

    <p class="logout-tip" id="logout-link">Not you? <span>Sign Out</span></p>
  </div>

  <script>
    // STORAGE — SEM perfil.jpg! Tudo salvo no navegador
    const STORAGE_KEY = 'ps5_user_profiles';
    let profiles = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let activeId = localStorage.getItem('ps5_active_profile') || null;
    let tempPhoto = null;

    // CLOCK
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = 
        now.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', hour12:false });
    }
    updateClock();
    setInterval(updateClock, 60000);

    // SALVAR PERFIS
    function saveProfiles() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
    }

    // ATUALIZAR FOTO NO CANTO — A FUNÇÃO PRINCIPAL! ✅
    function updateCornerAvatar(photoData = null) {
      const avatarEl = document.getElementById('current-avatar');
      
      if (photoData) {
        // TEM FOTO ESCOLHIDA — MOSTRA ELA
        avatarEl.innerHTML = `<img src="${photoData}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
        avatarEl.classList.add('has-photo');
      } else {
        // SEM FOTO — MOSTRA ÍCONE PADRÃO
        avatarEl.innerHTML = `<i class="fas fa-user"></i>`;
        avatarEl.classList.remove('has-photo');
      }
    }

    // RENDERIZAR TELA DE SELEÇÃO
    function renderProfiles() {
      const container = document.getElementById('accounts-row');
      container.innerHTML = '';

      profiles.forEach(p => {
        const div = document.createElement('div');
        div.className = 'user-account';
        div.innerHTML = `
          <div class="avatar-ring">
            <img class="avatar-img" src="${p.photo}" alt="${p.name}">
          </div>
          <span class="user-name">${p.name}</span>
        `;
        div.onclick = () => login(p.id);
        container.appendChild(div);
      });

      // BOTÃO NOVO USUÁRIO
      const newBtn = document.createElement('div');
      newBtn.className = 'new-user-btn';
      newBtn.innerHTML = `
        <div class="plus-circle">+</div>
        <span class="new-user-text">New User</span>
      `;
      newBtn.onclick = openCreateScreen;
      container.appendChild(newBtn);
    }

    // ABRIR TELA DE CRIAÇÃO
    function openCreateScreen() {
      document.getElementById('select-screen').classList.add('hidden');
      document.getElementById('create-screen').classList.add('active');
      tempPhoto = null;
      document.getElementById('preview-holder').classList.remove('has-img');
      document.getElementById('preview-img').src = '';
      document.getElementById('name-field').value = '';
    }

    // VOLTAR PARA SELEÇÃO
    document.getElementById('back-to-select').onclick = () => {
      document.getElementById('create-screen').classList.remove('active');
      document.getElementById('select-screen').classList.remove('hidden');
    };

    // PREVISUALIZAR FOTO NA CRIAÇÃO
    document.getElementById('file-input').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        tempPhoto = ev.target.result;
        document.getElementById('preview-img').src = tempPhoto;
        document.getElementById('preview-holder').classList.add('has-img');
      };
      reader.readAsDataURL(file);
    });

    // TROCAR FOTO JÁ LOGADO
    document.getElementById('change-photo-input').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const newPhoto = ev.target.result;
        // Atualizar no perfil ativo
        const profile = profiles.find(p => p.id === activeId);
        if (profile) {
          profile.photo = newPhoto;
          saveProfiles();
          updateCornerAvatar(newPhoto); // ✅ Atualiza no canto na hora!
        }
      };
      reader.readAsDataURL(file);
    });

    // CRIAR CONTA
    document.getElementById('create-account-btn').onclick = () => {
      const name = document.getElementById('name-field').value.trim();
      if (!name) return alert('Enter your name!');
      if (!tempPhoto) return alert('Choose a profile photo!');

      const newProfile = {
        id: 'profile_' + Date.now(),
        name: name,
        photo: tempPhoto
      };
      profiles.push(newProfile);
      saveProfiles();
      login(newProfile.id);
    };

    // ENTRAR
    function login(id) {
      activeId = id;
      localStorage.setItem('ps5_active_profile', id);
      const profile = profiles.find(p => p.id === id);
      
      // Atualizar foto no canto ✅
      updateCornerAvatar(profile.photo);

      // Transição de telas
      document.getElementById('select-screen').classList.add('hidden');
      document.getElementById('create-screen').classList.remove('active');
      document.getElementById('bg-layer').classList.add('fade-out');
      
      setTimeout(() => {
        document.getElementById('ps5-interface').classList.add('visible');
      }, 400);
    }

    // SAIR
    document.getElementById('logout-link').onclick = () => {
      activeId = null;
      localStorage.removeItem('ps5_active_profile');
      
      // Volta ao ícone padrão ✅
      updateCornerAvatar(null);

      document.getElementById('ps5-interface').classList.remove('visible');
      document.getElementById('bg-layer').classList.remove('fade-out');
      
      setTimeout(() => {
        renderProfiles();
        document.getElementById('select-screen').classList.remove('hidden');
      }, 400);
    };

    // NAVEGAÇÃO DOS JOGOS
    const games = [
      { name: "Grand Theft Auto V™", cover: "assets/images/capa-gta.jpg" },
      { name: "Five Nights At Freddy's™", cover: "assets/images/capa-fnaf.jpg" },
      { name: "Minecraft™", cover: "assets/images/capa-minecraft.jpg" },
      { name: "DIRT 5™", cover: "assets/images/capa-dirt5.jpg" },
      { name: "Marvel's Spider-Man™", cover: "assets/images/capa-spiderman.jpg" }
    ];
    let currentGameIndex = 2;

    document.querySelectorAll('.game-card').forEach(card => {
      card.onclick = () => {
        document.querySelectorAll('.game-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        currentGameIndex = parseInt(card.dataset.index);
        const game = games[currentGameIndex];
        document.getElementById('game-title').textContent = game.name;
        document.getElementById('side-cover').src = game.cover;
      };
    });

    // INICIALIZAR
    renderProfiles();
    
    // Se tem sessão ativa → entra direto com a foto correta ✅
    if (activeId) {
      const profile = profiles.find(p => p.id === activeId);
      if (profile) {
        updateCornerAvatar(profile.photo);
        document.getElementById('select-screen').classList.add('hidden');
        document.getElementById('bg-layer').classList.add('fade-out');
        document.getElementById('ps5-interface').classList.add('visible');
      }
    }
  </script>
</body>
</html>
