<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAR CBF - Animação Total</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
body {
  background: linear-gradient(135deg, #0A2390 0%, #1E50D0 50%, #0A2390 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}

.var-screen {
  width: 1080px; height: 600px;
  background: linear-gradient(180deg, #0F34B8 0%, #2060E8 100%);
  position: relative; overflow: hidden;
}

/* Brilho de fundo pulsando */
.screen-glow {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08) 0%, transparent 60%);
  animation: pulseGlow 2s ease-in-out infinite;
}

/* === TOPO: TROFÉU + CBF === */
.top-logos {
  position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 15px;
}

/* TROFÉU - animação própria */
.trophy-logo {
  width: 70px; height: 70px; object-fit: contain;
  opacity: 0; transform: scale(0) rotate(-180deg);
  animation: logoSpinIn 0.5s ease-out forwards, floatBounce 2s ease-in-out infinite 0.5s, glowPulse 1.5s ease-in-out infinite 0.5s;
}

.divider {
  width: 2px; height: 0; background: #fff; opacity: 0;
  animation: lineGrow 0.35s ease-out 0.2s forwards, flicker 1s ease-in-out infinite 0.5s;
}

/* ESCUDO CBF - animação própria */
.cbf-shield {
  width: 70px; height: 80px; object-fit: contain;
  opacity: 0; transform: scale(0) rotate(180deg);
  animation: logoSpinIn 0.5s ease-out 0.35s forwards, floatBounce 2s ease-in-out infinite 0.8s, glowPulse 1.5s ease-in-out infinite 0.8s;
}

/* === MIDEA - animação própria === */
.midea-box {
  position: absolute; left: 20px; bottom: 120px;
  background: #0090FF; padding: 12px 22px; border-radius: 4px;
  transform: translateX(-100%) skewX(-15deg); opacity: 0;
  animation: mideaBurst 0.5s cubic-bezier(0.17, 0.67, 0.12, 0.99) 0.1s forwards;
  box-shadow: 0 0 0 rgba(0,144,255,0);
}
.midea-logo {
  height: 36px; width: auto; object-fit: contain;
  filter: brightness(1);
  animation: logoBrightPulse 1.2s ease-in-out infinite 0.5s;
}

/* === CBF TEXTO === */
.cbf-label {
  color: #fff; font-size: 32px; font-weight: bold;
  margin-left: 30px; margin-bottom: 5px;
  opacity: 0; transform: translateY(15px) scale(0.9);
  animation: textPop 0.4s ease-out 0.45s forwards;
}

/* === VAR LETRAS === */
.var-group {
  position: absolute; left: 220px; bottom: 80px;
}
.var-text-wrapper {
  position: relative; display: inline-block;
}
.var-letter {
  display: inline-block;
  color: #fff; font-size: 110px; font-weight: 900;
  line-height: 1;
  opacity: 0; transform: translateY(40px) scale(0.7);
  text-shadow: 0 0 0 rgba(255,255,255,0);
  animation: letterBurst 0.45s ease-out forwards;
}
.var-letter:nth-child(1) { animation-delay: 0.55s; }
.var-letter:nth-child(2) { animation-delay: 0.7s; }
.var-letter:nth-child(3) { animation-delay: 0.85s; }

/* Elementos decorativos */
.qt-left, .qt-right {
  position: absolute; top: 10px; color: #fff;
  font-size: 60px; font-weight: bold; line-height: 1;
  opacity: 0; transform: scale(2);
  animation: quickFade 0.3s ease-out 0.95s forwards;
}
.qt-left { left: -18px; }
.qt-right { right: -18px; }

.bracket-l {
  position: absolute; bottom: 5px; left: -55px;
  width: 45px; height: 0;
  border-left: 6px solid #fff; border-bottom: 6px solid #fff;
  border-radius: 0 0 0 20px;
  opacity: 0;
  animation: drawBracketL 0.4s ease-out 1.05s forwards;
}
.bracket-r {
  position: absolute; bottom: 5px; right: -55px;
  width: 45px; height: 0;
  border-right: 6px solid #fff; border-bottom: 6px solid #fff;
  border-radius: 0 0 20px 0;
  opacity: 0;
  animation: drawBracketR 0.4s ease-out 1.15s forwards;
}

.arrow-curve {
  position: absolute; top: 5px; right: -45px;
  width: 0; height: 0;
  border-top: 8px solid #fff; border-right: 8px solid #fff;
  border-radius: 0 22px 0 0;
  opacity: 0;
  animation: drawArrow 0.45s ease-out 1.25s forwards;
}
.arrow-tip {
  position: absolute; right: -12px; top: 78px;
  width: 0; height: 0;
  border-top: 12px solid transparent;
  border-bottom: 12px solid transparent;
  border-left: 0 solid #fff;
  opacity: 0;
  animation: tipShow 0.3s ease-out 1.4s forwards;
}

/* ========== KEYFRAMES ========== */
@keyframes pulseGlow {
  0%,100% { opacity: 0.6; }
  50% { opacity: 1; }
}
@keyframes logoSpinIn {
  to { opacity: 1; transform: scale(1) rotate(0deg); }
}
@keyframes floatBounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes glowPulse {
  0%,100% { filter: drop-shadow(0 0 6px rgba(255,255,255,0.4)); }
  50% { filter: drop-shadow(0 0 18px rgba(255,255,255,0.8)); }
}
@keyframes lineGrow {
  to { height: 50px; opacity: 0.7; }
}
@keyframes flicker {
  0%,100% { opacity: 0.7; }
  50% { opacity: 1; }
}
@keyframes mideaBurst {
  to { transform: translateX(0) skewX(0); opacity: 1; box-shadow: 0 0 25px rgba(0,144,255,0.5); }
}
@keyframes logoBrightPulse {
  0%,100% { filter: brightness(1); }
  50% { filter: brightness(1.3); }
}
@keyframes textPop {
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes letterBurst {
  0% { opacity: 0; transform: translateY(40px) scale(0.7); text-shadow: 0 0 30px rgba(255,255,255,0); }
  60% { transform: translateY(-8px) scale(1.08); text-shadow: 0 0 25px rgba(255,255,255,0.7); }
  100% { opacity: 1; transform: translateY(0) scale(1); text-shadow: 0 0 12px rgba(255,255,255,0.4); }
}
@keyframes quickFade {
  to { opacity: 1; transform: scale(1); }
}
@keyframes drawBracketL {
  to { opacity: 1; height: 75px; }
}
@keyframes drawBracketR {
  to { opacity: 1; height: 75px; }
}
@keyframes drawArrow {
  to { opacity: 1; width: 85px; height: 85px; }
}
@keyframes tipShow {
  to { opacity: 1; border-left-width: 20px; }
}
</style>
</head>
<body>

<div class="var-screen">
  <div class="screen-glow"></div>

  <!-- Topo: TROFÉU + CBF -->
  <div class="top-logos">
    <img src="assets/imagens/trofeu.png" alt="Troféu" class="trophy-logo">
    <div class="divider"></div>
    <img src="assets/imagens/cbf-escudo.png" alt="CBF" class="cbf-shield">
  </div>

  <!-- MIDEA -->
  <div class="midea-box">
    <img src="assets/imagens/midea-logo.png" alt="Midea" class="midea-logo">
  </div>

  <!-- CBF + VAR -->
  <div class="var-group">
    <div class="cbf-label">CBF</div>
    <div class="var-text-wrapper">
      <span class="qt-left">"</span>
      <div class="bracket-l"></div>
      <span class="var-letter">V</span>
      <span class="var-letter">A</span>
      <span class="var-letter">R</span>
      <span class="qt-right">"</span>
      <div class="bracket-r"></div>
      <div class="arrow-curve"></div>
      <div class="arrow-tip"></div>
    </div>
  </div>
</div>

</body>
</html>
